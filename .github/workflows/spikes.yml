name: Spikes

# Phase P decision-gate spike still open (docs/OVERHAUL_PLAN.md section 6):
#   P2: Tauri 2 window, wgpu viewport, transparent webview self-test (Windows, macOS).
# P1 (native OCCT) passed and was removed; the Engine workflow builds OCCT for the crates.
# Linux is not run: the swapchain draws over the webview there (Linux desktop is deferred).
# Runs by hand, or on pushes to main that touch spikes/. Never on tags, so it stays out of
# the Release workflow's way. Results go to each job's summary (no artifacts).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["spikes/**", ".github/workflows/spikes.yml"]

permissions:
  contents: read

concurrency:
  group: spikes-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

jobs:
  p2:
    name: P2 ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest }
          - { name: macos, os: macos-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev \
            libssl-dev libayatana-appindicator3-dev xvfb mesa-vulkan-drivers \
            libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libegl1-mesa-dev \
            libgbm-dev libwayland-dev clang
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spikes
      - name: Build
        working-directory: spikes
        run: cargo build --release -p p2-tauri
      - name: Self-test
        working-directory: spikes
        run: |
          mkdir -p out && cd out
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a -s "-screen 0 1920x1080x24" ../target/release/p2-tauri 2>&1 | tee p2.txt
          else
            ../target/release/p2-tauri 2>&1 | tee p2.txt
          fi
          status=${PIPESTATUS[0]}
          {
            echo "## P2 ${{ matrix.name }} (${{ matrix.os }}, exit $status)"
            echo
            echo '```'
            grep -v Chrome_WidgetWin p2.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
