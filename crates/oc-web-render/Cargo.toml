[package]
name = "oc-web-render"
version = "0.1.0"
description = "The browser's viewport (OVERHAUL_PLAN W1c): oc-render on WebGPU in a render worker, drawing into an OffscreenCanvas under the transparent UI, fed by the same frames, picks and meshes as oc-app's render thread (oc-view). A wasm-bindgen module for wasm32-unknown-unknown; empty on other targets."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
oc-mesh = { path = "../oc-mesh" }
oc-render = { path = "../oc-render" }
oc-view = { path = "../oc-view" }
wgpu = "30.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
js-sys = "0.3.107"
web-sys = { version = "0.3.107", features = ["OffscreenCanvas", "console"] }
web-time = "1.1"

# `mesh_blobs`: display meshes for the harness, made natively (the engine worker's are W1b's).
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
oc-kernel = { path = "../oc-kernel" }
oc-kernel-occt = { path = "../oc-kernel-occt" }
oc-mesh = { path = "../oc-mesh" }

[lints]
workspace = true
