[package]
name = "oc-app"
version = "0.7.0"
description = "OpenCAD desktop app on the native engine (OVERHAUL_PLAN F2): Tauri 2 window, the React UI in a transparent webview over an oc-render wgpu viewport, documents regenerated by oc-graph on oc-kernel-occt."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "opencad"

[[bin]]
name = "opencad"
path = "src/main.rs"

[features]
# Embed the built web UI (`npm run build` → dist/) and serve it from the app. Without it
# (plain `cargo run`) the webview loads the Vite dev server at http://localhost:5173.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
oc-asm = { path = "../oc-asm" }
oc-doc = { path = "../oc-doc" }
oc-graph = { path = "../oc-graph" }
oc-kernel = { path = "../oc-kernel" }
oc-kernel-occt = { path = "../oc-kernel-occt" }
oc-mesh = { path = "../oc-mesh" }
oc-naming = { path = "../oc-naming" }
oc-render = { path = "../oc-render" }
tauri = { version = "2.12.5", features = [] }
wgpu = "30.0.1"
glam = "0.30"
pollster = "1"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Console", "Win32_UI_Controls_Dialogs"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints]
workspace = true
