[package]
name = "oc-asm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "OpenCAD assemblies: part file search, shared regeneration, mate references by name, lightweight caches (OVERHAUL_PLAN G1)"

[dependencies]
oc-doc = { path = "../oc-doc" }
oc-graph = { path = "../oc-graph" }
oc-kernel = { path = "../oc-kernel" }
oc-mate = { path = "../oc-mate" }
oc-mesh = { path = "../oc-mesh" }
oc-naming = { path = "../oc-naming" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }

[dev-dependencies]
oc-kernel-occt = { path = "../oc-kernel-occt" }

[lints]
workspace = true
