[package]
name = "oc-engine"
version = "0.1.0"
description = "OpenCAD's engine without a shell (OVERHAUL_PLAN W1b): the engine thread's jobs (parts regenerated by oc-graph on oc-kernel-occt, assemblies by oc-asm, meshed by oc-mesh) and their replies, used by the desktop app (oc-app) and the browser's engine worker (oc-web)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
oc-asm = { path = "../oc-asm" }
oc-doc = { path = "../oc-doc" }
oc-graph = { path = "../oc-graph" }
oc-host = { path = "../oc-host" }
oc-kernel = { path = "../oc-kernel" }
oc-kernel-occt = { path = "../oc-kernel-occt" }
oc-mesh = { path = "../oc-mesh" }
oc-naming = { path = "../oc-naming" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }

[lints]
workspace = true
