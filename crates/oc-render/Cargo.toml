[package]
name = "oc-render"
version = "0.1.0"
description = "wgpu viewport renderer, phase 1: display styles, highlights, reference geometry, triad, section capping and ID-buffer picking over oc-mesh buffers."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
oc-mesh = { path = "../oc-mesh" }
wgpu = "30.0.1"
glam = "0.30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"

[dev-dependencies]
wgpu = "30.0.1"
oc-kernel = { path = "../oc-kernel" }
oc-kernel-occt = { path = "../oc-kernel-occt" }
png = "0.17"

[lints]
workspace = true
