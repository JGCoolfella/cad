[package]
name = "oc-sketch-wasm"
version = "0.1.0"
description = "WebAssembly binding of oc-sketch for the TypeScript sketch editor (src/sketch/wasmSolver.ts)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
oc-sketch = { path = "../oc-sketch" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
# Must match the wasm-bindgen CLI used by scripts/build-sketch-wasm.mjs exactly.
wasm-bindgen = "=0.2.130"

[lints]
workspace = true
